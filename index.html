<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beltone — Team Rota</title>

<style>
body { font-family: Arial; background:#f4f2ee; margin:0; padding:20px; }

.table-wrap { background:#fff; border-radius:10px; padding:10px; }
table { width:100%; border-collapse:collapse; }
td, th { border-bottom:1px solid #ddd; padding:8px; text-align:center; }

.slot {
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
  display:inline-block;
}
.slot-wfo { background:#f5f5dc; }
.slot-wfh { background:#fdecea; }

.slot[draggable="true"]:active { opacity:0.5; }

.slot-swapped {
  outline:2px dashed orange;
  position:relative;
}
.slot-swapped::after {
  content:"⇄";
  position:absolute;
  top:-6px;
  right:-6px;
  background:orange;
  font-size:10px;
  padding:2px 4px;
  border-radius:4px;
}

button { padding:5px 10px; margin:3px; cursor:pointer; }
.btn-green { background:#4CAF50; color:white; }
.btn-red { background:#e53935; color:white; }

#approval-list div {
  border:1px solid #ddd;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
}
</style>
</head>

<body>

<h2>Team Rota</h2>

<div class="table-wrap">
<table>
<thead id="rota-head"></thead>
<tbody id="rota-body"></tbody>
</table>
</div>

<h3 style="margin-top:20px;">Pending Swap Requests</h3>
<div id="approval-list"></div>

<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu'];

let rota = {
  members: [
    {id:1,name:'Younis'},
    {id:2,name:'Mahgoub'},
    {id:3,name:'Omar'}
  ],
  slots: {}
};

let dragSource = null;
let swapRequests = [];
let swappedPairs = new Set();

function slotKey(id, dk) { return id + '|' + dk; }

function getWeekDates(){
  const base = new Date();
  return Array.from({length:5},(_,i)=>{
    const d=new Date(base);
    d.setDate(base.getDate()+i);
    return d.toISOString().slice(0,10);
  });
}

function seed(){
  const dates = getWeekDates();
  rota.members.forEach(m=>{
    dates.forEach(d=>{
      rota.slots[slotKey(m.id,d)] = Math.random()>0.5?'WFO':'WFH';
    });
  });
}

function render(){
  const dates = getWeekDates();

  document.getElementById('rota-head').innerHTML =
    `<tr>
      <th>Name</th>
      ${dates.map(d=>`<th>${d}</th>`).join('')}
    </tr>`;

  let html='';

  rota.members.forEach(m=>{
    html+=`<tr><td>${m.name}</td>`;

    dates.forEach(d=>{
      const key = slotKey(m.id,d);
      const s = rota.slots[key];
      const swappedClass = swappedPairs.has(key) ? 'slot-swapped' : '';

      html+=`
      <td>
        <span draggable="true"
          ondragstart="dragStart(event,${m.id},'${d}')"
          ondragover="allowDrop(event)"
          ondrop="drop(event,${m.id},'${d}')"
          class="slot ${s==='WFO'?'slot-wfo':'slot-wfh'} ${swappedClass}">
          ${s}
        </span>
      </td>`;
    });

    html+='</tr>';
  });

  document.getElementById('rota-body').innerHTML = html;

  renderApprovals();
}

function dragStart(e, id, dk){
  dragSource = { id, dk };
}

function allowDrop(e){
  e.preventDefault();
}

function drop(e, targetId, targetDk){
  e.preventDefault();
  if (!dragSource) return;

  swapRequests.push({
    id: Date.now(),
    from: dragSource,
    to: { id: targetId, dk: targetDk }
  });

  dragSource = null;
  render();
}

function renderApprovals(){
  const el = document.getElementById('approval-list');

  if (!swapRequests.length){
    el.innerHTML = '<span style="color:#999;">No pending requests</span>';
    return;
  }

  el.innerHTML = swapRequests.map(r=>{
    const fromName = rota.members.find(m=>m.id===r.from.id).name;
    const toName = rota.members.find(m=>m.id===r.to.id).name;

    return `
      <div>
        ${fromName} (${r.from.dk}) ⇄ ${toName} (${r.to.dk})<br>
        <button class="btn-green" onclick="approveSwap(${r.id})">Approve</button>
        <button class="btn-red" onclick="rejectSwap(${r.id})">Reject</button>
      </div>
    `;
  }).join('');
}

function approveSwap(id){
  const r = swapRequests.find(x=>x.id===id);
  if (!r) return;

  const A = slotKey(r.from.id, r.from.dk);
  const B = slotKey(r.to.id, r.to.dk);

  let temp = rota.slots[A];
  rota.slots[A] = rota.slots[B];
  rota.slots[B] = temp;

  swappedPairs.add(A);
  swappedPairs.add(B);

  swapRequests = swapRequests.filter(x=>x.id!==id);

  render();
}

function rejectSwap(id){
  swapRequests = swapRequests.filter(x=>x.id!==id);
  render();
}

seed();
render();
</script>

</body>
</html>
